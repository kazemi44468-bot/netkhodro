function save(){localStorage.setItem('netkhodro_db',JSON.stringify(db))}function nextId(a){return a.length?Math.max(...a.map(x=>+x.id||0))+1:1}function code(type,id){return (type==='موتورسیکلت'?'MOT':'CAR')+'-'+String(id).padStart(4,'0')}function vehicleName(v){return (v.brand||'')+' '+(v.model||'')}function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2600)}function fmtDate(d){return d?new Date(d+'T00:00:00').toLocaleDateString('fa-IR'):'—'}

function checklistState(item,v){
 if(!item.checkedAt||item.result==='بررسی نشده')return {key:'unknown',label:'بررسی نشده'};
 if(item.result==='نیازمند اقدام'||item.result==='معیوب')return {key:'action',label:'نیازمند اقدام'};
 const days=dayGap(item.dueDate),kmLeft=item.dueKm?Number(item.dueKm)-Number(v?.km||0):null;
 if((days!==null&&days<0)||(kmLeft!==null&&kmLeft<=0))return {key:'late',label:'سررسید گذشته'};
 if((days!==null&&days<=30)||(kmLeft!==null&&kmLeft<=1000))return {key:'soon',label:'نزدیک سررسید'};
 if(!item.dueDate&&!item.dueKm)return {key:'unknown',label:'بدون سررسید'};
 return {key:'ok',label:'معتبر'};
}
function checkBadge(item,v){let st=checklistState(item,v);return '<span class="check-state '+st.key+'">'+st.label+'</span>'}

Rows)+'</div><div class="dossier-section"><h4>کارکرد و مأموریت</h4>'+table(['تاریخ','کیلومتر ابتدا و انتها','پیمایش','راننده','شرح مأموریت'],usageRows)+'</div><div class="dossier-section"><h4>سوابق تحویل و تخصیص</h4>'+table(['تاریخ','مبدأ','مقصد','مسئول'],as.map(a=>'<tr><td>'+fmtDate(a.date)+'</td><td>'+a.from+'</td><td>'+a.to+'</td><td>'+a.person+'</td></tr>'))+'</div><div class="actions"><button class="btn light" onclick="editVehicleFactor('+x.id+')">ضریب کارشناسی</button><button class="btn danger" onclick="removeVehicle('+x.id+')">حذف وسیله</button></div>');
}


function updateChecklist(id){
 let c=db.checklist.find(x=>x.id===id);if(!c)return;let v=db.vehicles.find(x=>x.code===c.vehicleCode);
 showModal('ثبت بررسی: '+c.title,'<form id="checkform"><div class="formgrid">'+field('تاریخ بررسی','lastDate','','date',today,true)+selectField('نتیجه بررسی','result',['سالم','نیازمند اقدام','معیوب'],c.result||'سالم')+field('موعد بعدی بر اساس تاریخ','dueDate','','date',shiftDate(c.intervalDays||180))+field('موعد بعدی بر اساس کیلومتر','dueKm','','number',c.intervalKm?Number(v?.km||0)+c.intervalKm:'')+'<div class="field full"><label>شرح بررسی و اقدام لازم</label><textarea name="notes" rows="3">'+(c.notes||'')+'</textarea></div></div><button class="btn">ثبت نتیجه و سررسید بعدی</button></form>');
 $('#checkform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));c.lastDate=d.lastDate;c.checkedAt=d.lastDate||today;c.result=d.result;c.dueDate=d.dueDate;c.dueKm=+d.dueKm||0;c.notes=d.notes;c.sample=false;save();closeModal();render(window.currentPage||'checklist');toast('بررسی و موعد بعدی ذخیره شد')};
}
function addChecklistItem(vehicleId){
 let v=vehicleId?db.vehicles.find(x=>x.id===vehicleId):db.vehicles[0];if(!v){toast('ابتدا وسیله نقلیه ثبت کنید');return}

 showModal('تعریف مورد جدید چک‌لیست','<form id="newcheckform"><div class="formgrid">'+selectField('وسیله نقلیه','vehicle',opts,v.code+' | '+vehicleName(v))+field('عنوان اقدام','title','مثلاً بازدید ترمزها','text','',true)+selectField('گروه','group',['مدارک قانونی','نگهداری','ایمنی','سایر'])+field('آخرین تاریخ بررسی','lastDate','','date','')+field('موعد بعدی','dueDate','','date')+field('موعد بعدی کیلومتری','dueKm','','number')+field('فاصله زمانی تکرار (روز)','intervalDays','','number','')+field('فاصله کارکرد تکرار (کیلومتر)','intervalKm','','number','')+'</div><button class="btn">افزودن به چک‌لیست</button></form>');
 $('#newcheckform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.checklist.push({...d,id:nextId(db.checklist),vehicleCode:d.vehicle.split(' | ')[0],dueKm:+d.dueKm||0,intervalDays:+d.intervalDays||0,intervalKm:+d.intervalKm||0,result:'بررسی نشده',checkedAt:''});save();closeModal();render(window.currentPage||'checklist');toast('مورد کنترلی افزوده شد')};

function updateVehiclePhoto(id){let v=db.vehicles.find(x=>x.id===id);showModal('ثبت تصویر وسیله نقلیه','<form id="photoform">'+field('نشانی تصویر','photo','پیوند تصویر','url',v.photo||'')+'<button class="btn">ذخیره تصویر</button></form>');$('#photoform').onsubmit=e=>{e.preventDefault();v.photo=new FormData(e.target).get('photo');save();closeModal();vehicleDetail(id);toast('تصویر پرونده به‌روزرسانی شد')}}
function openVehicleDocument(id){
 let v=db.vehicles.find(x=>x.id===id);showModal('ثبت مدرک وسیله','<form id="docform"><div class="formgrid">'+selectField('نوع مدرک','type',['بیمه‌نامه شخص ثالث','بیمه بدنه','معاینه فنی','کارت خودرو','سند مالکیت','مجوز تردد','سایر'])+field('شماره مدرک','number')+field('تاریخ صدور','issueDate','','date')+field('تاریخ انقضا','expiryDate','','date')+field('صادرکننده','issuer')+field('پیوند فایل یا محل نگهداری','url','نشانی فایل/سامانه','url')+'</div><button class="btn">ذخیره مدرک</button></form>');
 $('#docform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.documents.push({...d,id:nextId(db.documents),vehicleCode:v.code});let c=db.checklist.find(x=>x.vehicleCode===v.code&&((d.type.includes('بیمه')&&x.title==='بیمه شخص ثالث')||(d.type==='معاینه فنی'&&x.title==='معاینه فنی')));if(c&&d.expiryDate)c.dueDate=d.expiryDate;save();closeModal();vehicleDetail(id);toast('مدرک در پرونده ثبت شد')};
}
function openFuel(vehicleId){
 let v=vehicleId?db.vehicles.find(x=>x.id===vehicleId):db.vehicles[0];if(!v){toast('ابتدا وسیله نقلیه ثبت کنید');return}
 let opts=db.vehicles.map(x=>x.code+' | '+vehicleName(x));
 showModal('ثبت سوخت‌گیری','<form id="fuelform"><div class="formgrid">'+selectField('وسیله نقلیه','vehicle',opts,v.code+' | '+vehicleName(v))+field('تاریخ سوخت‌گیری','date','','date',today,true)+field('مقدار (لیتر)','liters','','number','',true)+field('مبلغ (تومان)','amount','','number','',true)+field('کیلومتر هنگام سوخت‌گیری','odometer','','number',v.km,true)+selectField('نوع سوخت','fuelType',['بنزین','گازوئیل','گاز','برق'])+field('جایگاه / تأمین‌کننده','station')+field('شماره رسید','receipt')+'</div><button class="btn">ثبت سوخت‌گیری</button></form>');
 $('#fuelform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),veh=db.vehicles.find(x=>x.code===d.vehicle.split(' | ')[0]);db.fuel.push({...d,id:nextId(db.fuel),vehicleCode:veh.code,liters:+d.liters,amount:+d.amount,odometer:+d.odometer});if(+d.odometer>veh.km)veh.km=+d.odometer;db.expenses.push({id:nextId(db.expenses),date:d.date,vehicleCode:veh.code,title:'سوخت‌گیری: '+fa(d.liters)+' لیتر',category:'سوخت',amount:+d.amount,payee:d.station||'جایگاه ثبت‌نشده',factor:1,fuelId:nextId(db.fuel)});save();closeModal();render(window.currentPage||'fuel');toast('سوخت‌گیری ثبت شد')};
}

function editVehicleFactor(id){let x=db.vehicles.find(v=>v.id===id);showModal('تغییر ضریب کارشناسی','<form id="factorform">'+field('ضریب اختصاصی','factor','','number',x.factor||1,true)+'<div class="field"><label>علت تغییر</label><textarea name="reason" required></textarea></div><button class="btn">ثبت تغییر</button></form>');$('#factorform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));x.factor=+d.factor;x.factorReason=d.reason;x.factorDate=today;save();closeModal();render();toast('ضریب اختصاصی ذخیره شد')}}
function removeVehicle(id){let v=db.vehicles.find(x=>x.id===id);if(!v||!confirm('خروج این وسیله از ناوگان ثبت شود؟ سوابق، هزینه‌ها و چک‌لیست آن حفظ خواهند شد.'))return;v.status='خارج از ناوگان';v.archivedAt=today;save();closeModal();render();toast('خروج وسیله ثبت شد؛ سوابق آن حفظ شده است')}
function openAssignment(){let opts=db.vehicles.map(x=>x.code+' | '+vehicleName(x));if(!opts.length){toast('ابتدا وسیله نقلیه ثبت کنید');return}let inner=selectField('وسیله نقلیه','vehicle',opts)+selectField('نوع عملیات','action',['تحویل اولیه','تحویل‌گیری','انتقال بین اشخاص','انتقال بین ادارات','تحویل به تعمیرگاه'])+field('تاریخ و ساعت','date','','date',today,true)+field('مبدأ / تحویل‌دهنده','from','شرکت یا شخص')+field('مقصد / تحویل‌گیرنده','to','اداره یا شخص', 'text','',true)+field('شخص مسئول','person','نام تحویل‌گیرنده')+field('کیلومتر هنگام تحویل','km','','number','0')+selectField('میزان سوخت','fuel',['خالی','یک‌چهارم','نصف','سه‌چهارم','پر'])+'<div class="field full"><label>وضعیت ظاهری و توضیحات</label><textarea name="notes" rows="2"></textarea></div>';showModal('ثبت سند تحویل و جابه‌جایی',formWrap(inner,'ثبت سند و به‌روزرسانی تخصیص'));$('#entryform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),v=db.vehicles.find(x=>x.code===d.vehicle.split(' | ')[0]);let id=nextId(db.assignments);db.assignments.push({...d,id,code:'HVL-'+String(id).padStart(5,'0'),vehicleCode:v.code,km:+d.km||0});if(d.action==='تحویل‌گیری'){v.currentPerson='';v.currentDept='';}else{v.currentPerson=d.person||d.to;v.currentDept=d.to;}if(d.km)v.km=Math.max(+v.km,+d.km);save();closeModal();render();toast('سند تحویل ثبت و تخصیص به‌روزرسانی شد')}}
function openMaintenance(){let opts=db.vehicles.map(x=>x.code+' | '+vehicleName(x));if(!opts.length){toast('ابتدا وسیله نقلیه ثبت کنید');return}let inner=selectField('وسیله نقلیه','vehicle',opts)+field('تاریخ اقدام','date','','date',today,true)+field('شرح اقدام','title','مثلاً تعویض روغن', 'text','',true)+selectField('نوع اقدام','kind',['سرویس دوره‌ای','تعمیرات','بازدید فنی','تعویض قطعه','بیمه و معاینه'])+field('کیلومتر هنگام اقدام','km','','number','0')+field('سررسید بعدی','nextDate','','date')+selectField('وضعیت','status',['در انتظار','در حال انجام','انجام شد'])+field('تعمیرگاه / مجری','provider')+field('هزینه (تومان)','amount','','number','0')+'<div class="field full"><label>شرح فنی و قطعات مصرفی</label><textarea name="notes" rows="2"></textarea></div>';showModal('ثبت اقدام نگهداری و تعمیرات',formWrap(inner));$('#entryform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),v=db.vehicles.find(x=>x.code===d.vehicle.split(' | ')[0]);db.maintenance.push({...d,id:nextId(db.maintenance),vehicleCode:v.code,km:+d.km||0,amount:+d.amount||0});if(+d.km>v.km)v.km=+d.km;if(+d.amount)db.expenses.push({id:nextId(db.expenses),date:d.date,vehicleCode:v.code,title:'هزینه: '+d.title,category:'تعمیرات',amount:+d.amount,payee:d.provider,factor:1});save();closeModal();render();toast('اقدام فنی ثبت شد')}}
function openExpense(){let opts=db.vehicles.map(x=>x.code+' | '+vehicleName(x));if(!opts.length){toast('ابتدا وسیله نقلیه ثبت کنید');return}let inner=selectField('وسیله نقلیه','vehicle',opts)+field('تاریخ هزینه','date','','date',today,true)+field('شرح هزینه','title','شرح فاکتور','text','',true)+selectField('سرفصل هزینه','category',['تعمیرات','سوخت','بیمه','قطعات','عوارض و جرایم','سایر'])+field('مبلغ (تومان)','amount','','number','0',true)+field('تأمین‌کننده / دریافت‌کننده','payee')+field('نرخ طلای ۱۸ عیار در تاریخ هزینه (تومان/گرم)','goldRate','','number')+field('شماره فاکتور','invoice')+'<div class="field full"><label>توضیحات</label><textarea name="notes"></textarea></div>';showModal('ثبت هزینه ناوگان',formWrap(inner));$('#entryform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.expenses.push({...d,id:nextId(db.expenses),vehicleCode:d.vehicle.split(' | ')[0],amount:+d.amount||0,goldRate:+d.goldRate||0,factor:1});save();closeModal();render();toast('هزینه با موفقیت ثبت شد')}}
function openUsage(){let opts=db.vehicles.map(x=>x.code+' | '+vehicleName(x));if(!opts.length){toast('ابتدا وسیله نقلیه ثبت کنید');return}let inner=selectField('وسیله نقلیه','vehicle',opts)+field('تاریخ','date','','date',today,true)+field('راننده / مسئول','person','نام شخص', 'text','',true)+field('کیلومتر ابتدا','start','','number','0',true)+field('کیلومتر انتها','end','','number','0',true)+field('شرح مأموریت','mission','مقصد و هدف مأموریت');showModal('ثبت کارکرد و مأموریت',formWrap(inner));$('#entryform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),v=db.vehicles.find(x=>x.code===d.vehicle.split(' | ')[0]);if(+d.end<+d.start){toast('کیلومتر انتها نمی‌تواند کمتر از ابتدا باشد');return}if(+d.start<v.km){toast('کیلومتر ابتدا از آخرین کیلومتر ثبت‌شده کمتر است');return}db.usage.push({...d,id:nextId(db.usage),vehicleCode:v.code,start:+d.start,end:+d.end});v.km=+d.end;save();closeModal();render();toast('کارکرد ثبت شد')}}
function openGold(){showModal('ثبت نرخ طلا','<form id="goldform"><div class="formgrid">'+field('تاریخ نرخ','date','','date',today,true)+selectField('نوع شاخص','type',['۱۸ عیار','۲۴ عیار'])+field('قیمت هر گرم (تومان)','rate','','number','',true)+field('منبع نرخ','source','نام منبع / ثبت دستی')+'</div><button class="btn">ذخیره نرخ</button></form>');$('#goldform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.gold.push({...d,id:nextId(db.gold),rate:+d.rate});save();closeModal();render();toast('نرخ طلا ذخیره شد')}}
function openPerson(){showModal('افزودن اداره یا شخص',formWrap(selectField('نوع','type',['اداره','شخص'])+field('نام و عنوان','name','نام اداره یا شخص','text','',true)+field('شماره تماس','phone')+field('کد پرسنلی / شناسه','code')));$('#entryform').onsubmit=e=>{e.preventDefault();db.people.push({...Object.fromEntries(new FormData(e.target)),id:nextId(db.people)});save();closeModal();render();toast('اطلاعات ثبت شد')}}
function deletePerson(id){if(confirm('این مورد حذف شود؟')){db.people=db.people.filter(x=>x.id!==id);save();render()}}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='netkhodro-backup-'+today+'.json';a.click();URL.revokeObjectURL(a.href)}
function bindPage(){if($('#checkSearch')){let update=()=>{let q=$('#checkSearch').value.toLowerCase(),st=$('#checkState').value,g=$('#checkGroup').value;let a=db.checklist.filter(c=>{let v=db.vehicles.find(x=>x.code===c.vehicleCode);return v&&(!st||checklistState(c,v).key===st)&&(!g||c.group===g)&&[c.vehicleCode,vehicleName(v),c.title].join(' ').toLowerCase().includes(q)});$('#checkTable').innerHTML=table(['کد و وسیله','اقدام کنترلی','آخرین بررسی','موعد بعدی','مانده تا کیلومتر','وضعیت','عملیات'],checklistRows(a))};$('#checkSearch').oninput=update;$('#checkState').onchange=update;$('#checkGroup').onchange=update}if($('#vehicleSearch')){let update=()=>{let q=$('#vehicleSearch').value.toLowerCase(),t=$('#vehicleType').value,s=$('#vehicleStatus').value;let a=db.vehicles.filter(x=>(!t||x.type===t)&&(!s||x.status===s)&&[x.code,x.brand,x.model,x.plate,x.currentDept,x.currentPerson].join(' ').toLowerCase().includes(q));$('#vehicleTable').innerHTML=table(['کد اختصاصی','نوع','برند و مدل','سال ساخت','کیلومتر','محل تخصیص','وضعیت','عملیات'],a.map(x=>'<tr><td><b>'+x.code+'</b> '+(x.sample?'<span class="tag">نمونه</span>':'')+'</td><td>'+x.type+'</td><td>'+vehicleName(x)+'</td><td>'+fa(x.year||'—')+'</td><td>'+fa(x.km||0)+'</td><td>'+(x.currentPerson||x.currentDept||'—')+'</td><td>'+x.status+'</td><td><button class="btn light" onclick="vehicleDetail('+x.id+')">پرونده</button></td></tr>'))};$('#vehicleSearch').oninput=update;$('#vehicleType').onchange=update;$('#vehicleStatus').onchange=update}if($('#settingsform'))$('#settingsform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.settings={...db.settings,life:+d.life,rate:+d.rate,manual:+d.manual};save();toast('تنظیمات ذخیره شد');render()};if($('#restorefile'))$('#restorefile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.vehicles||!d.expenses)throw 0;db=d;['checklist','fuel','documents'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});db.vehicles.forEach(v=>{if(!db.checklist.some(c=>c.vehicleCode===v.code))createVehicleChecklist(v)});save();render();toast('نسخه پشتیبان بازیابی شد')}catch(_){toast('فایل پشتیبان معتبر نیست')}};r.readAsText(f)}}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)activePage(b.dataset.page)});$('#mobileDock').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)activePage(b.dataset.page)});window.addEventListener('scroll',()=>$('#backtop').classList.toggle('visible',window.scrollY>280));$('#backtop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));render();
</script></body></html>
